<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LA Weather" />
  <title>LA Forecast</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --bdr:#334155; --txt:#f8fafc; --mut:#94a3b8; --acc:#38bdf8; --rain:#60a5fa; --sun:#fbbf24; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
    body { background:var(--bg); color:var(--txt); padding:env(safe-area-inset-top,16px) 14px 32px; max-width:600px; margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; }
    h1 { font-size:1.2rem; font-weight:700; }
    .badge { font-size:.7rem; background:#0284c733; color:var(--acc); border:1px solid #0284c766; padding:3px 8px; border-radius:99px; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
    .tab { background:var(--card); border:1px solid var(--bdr); color:var(--mut); padding:10px 6px; border-radius:10px; font-size:.85rem; font-weight:600; cursor:pointer; }
    .tab.active { background:var(--acc); color:#0f172a; border-color:var(--acc); }
    .sub { font-size:.75rem; color:var(--mut); margin-bottom:12px; display:flex; justify-content:space-between; }
    .card { background:var(--card); border:1px solid var(--bdr); border-radius:14px; padding:14px; margin-bottom:10px; }
    .top { display:flex; justify-content:space-between; border-bottom:1px solid var(--bdr); padding-bottom:8px; margin-bottom:10px; font-weight:700; }
    .top span { color:var(--mut); font-weight:500; font-size:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 12px; font-size:.82rem; }
    .lbl { color:var(--mut); font-size:.68rem; text-transform:uppercase; display:block; }
    .val { font-weight:600; }
    .loading { text-align:center; padding:40px 10px; color:var(--mut); line-height:1.5; }
  </style>
</head>
<body>
  <header><h1>LA 7-Day Forecast</h1><span class="badge" id="badge">Loading...</span></header>
  <div class="tabs" id="tabs"></div>
  <div class="sub"><span id="desc"></span><span id="time"></span></div>
  <div id="list"><div class="loading">Fetching forecast...</div></div>
  <script>
    const LOCS = [
      { id:'coast', name:'Coast', desc:'Santa Monica / Venice / South Bay', lat:34.0195, lon:-118.4912 },
      { id:'basin', name:'LA Basin', desc:'DTLA / Culver City / Mid-City', lat:34.0259, lon:-118.3965 },
      { id:'valley', name:'Valleys', desc:'Pasadena / SGV / SFV', lat:34.1478, lon:-118.1445 }
    ];
    let active = LOCS.at(0), cache = {};
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    const compass = d => dirs.at(Math.round((d ?? 0) / 22.5) % 16);
    const cloudTxt = (l,m,h,t) => t < 15 ? `Clear (${t}%)` : (l>=m && l>=h) ? `${t>75?'Overcast':'Marine'} Stratus (${t}%)` : (m>=l && m>=h) ? `Altocumulus (${t}%)` : `High Cirrus (${t}%)`;
    const sunTxt = (uv,mj) => { const u=uv??0, m=mj??0; return `UV ${u.toFixed(1)} (${u>=8?'Very High':u>=6?'High':u>=3?'Moderate':'Low'}) · ${m.toFixed(1)} MJ/m²`; };

    async function getNWS(lat, lon) {
      try {
        const opts = { headers: { 'Accept': 'application/geo+json' } };
        const ptUrl = new URL(`https://weather.gov{lat},${lon}`);
        const ptRes = await fetch(ptUrl.href, opts);
        if (!ptRes.ok) return null;
        const pt = await ptRes.json();
        const fcRes = await fetch(pt.properties.forecast, opts);
        if (!fcRes.ok) return null;
        const fc = await fcRes.json();
        const map = {};
        fc.properties.periods.forEach(p => {
          const k = p.startTime.slice(0,10);
          if (!map[k]) map[k] = {};
          const pop = p.probabilityOfPrecipitation?.value ?? 0;
          if (p.isDaytime) { map[k].hi = p.temperature; map[k].dPop = pop; }
          else { map[k].lo = p.temperature; map[k].nPop = pop; }
        });
        return map;
      } catch { return null; }
    }

    async function load(loc) {
      document.getElementById('desc').textContent = loc.desc;
      if (cache[loc.id]) return render(cache[loc.id]);
      document.getElementById('list').innerHTML = '<div class="loading">Averaging NWS & Open-Meteo...</div>';
      try {
        const u = new URL('https://open-meteo.com');
        u.searchParams.set('latitude', String(loc.lat));
        u.searchParams.set('longitude', String(loc.lon));
        u.searchParams.set('daily', [
          'temperature_2m_max',
          'temperature_2m_min',
          'precipitation_sum',
          'precipitation_probability_max',
          'wind_speed_10m_max',
          'wind_direction_10m_dominant',
          'uv_index_max',
          'shortwave_radiation_sum'
        ].join(','));
        u.searchParams.set('hourly', [
          'cloud_cover',
          'cloud_cover_low',
          'cloud_cover_mid',
          'cloud_cover_high',
          'relative_humidity_2m'
        ].join(','));
        u.searchParams.set('temperature_unit', 'fahrenheit');
        u.searchParams.set('wind_speed_unit', 'mph');
        u.searchParams.set('precipitation_unit', 'inch');
        u.searchParams.set('timezone', 'America/Los_Angeles');

        const [omRes, nws] = await Promise.all([fetch(u.href), getNWS(loc.lat, loc.lon)]);
        if (!omRes.ok) throw new Error('Open-Meteo HTTP ' + omRes.status);
        const om = await omRes.json();
        const days = om.daily.time.map((dt, i) => {
          const s = i*24+8, e = i*24+19;
          const avg = a => Math.round(a.slice(s,e).reduce((x,y)=>x+(y??0),0)/11);
          let hi = om.daily.temperature_2m_max.at(i) ?? 0;
          let lo = om.daily.temperature_2m_min.at(i) ?? 0;
          let pop = om.daily.precipitation_probability_max.at(i) ?? 0;
          const nd = nws?.[dt];
          if (nd) {
            if (nd.hi != null) hi = (hi + nd.hi)/2;
            if (nd.lo != null) lo = (lo + nd.lo)/2;
            pop = Math.round((pop + Math.max(nd.dPop??0, nd.nPop??0))/2);
          }
          const lbl = i===0 ? 'Today' : new Date(dt+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
          return {
            lbl, hi:Math.round(hi), lo:Math.round(lo), pop,
            in: (om.daily.precipitation_sum.at(i) ?? 0).toFixed(2),
            cld: cloudTxt(avg(om.hourly.cloud_cover_low), avg(om.hourly.cloud_cover_mid), avg(om.hourly.cloud_cover_high), avg(om.hourly.cloud_cover)),
            hum: avg(om.hourly.relative_humidity_2m),
            wnd: `${compass(om.daily.wind_direction_10m_dominant.at(i))} ${Math.round(om.daily.wind_speed_10m_max.at(i) ?? 0)} mph`,
            sun: sunTxt(om.daily.uv_index_max.at(i), om.daily.shortwave_radiation_sum.at(i))
          };
        });
        cache[loc.id] = { days, blended:!!nws, time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) };
        render(cache[loc.id]);
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="loading">Error: ${err.message}</div>`;
      }
    }

    function render(d) {
      document.getElementById('badge').textContent = d.blended ? 'NWS + Open-Meteo' : 'Open-Meteo';
      document.getElementById('time').textContent = `Updated ${d.time}`;
      document.getElementById('list').innerHTML = d.days.map(x => `
        <div class="card">
          <div class="top"><div>${x.lbl}</div><div>${x.hi}° <span>/ ${x.lo}°</span></div></div>
          <div class="grid">
            <div><span class="lbl">Precipitation</span><span class="val" style="color:var(--rain)">${x.pop}% · ${x.in}"</span></div>
            <div><span class="lbl">Clouds</span><span class="val">${x.cld}</span></div>
            <div><span class="lbl">Wind (Peak)</span><span class="val">${x.wnd}</span></div>
            <div><span class="lbl">Humidity (Day)</span><span class="val">${x.hum}%</span></div>
            <div style="grid-column:span 2"><span class="lbl">Sun Intensity</span><span class="val" style="color:var(--sun)">${x.sun}</span></div>
          </div>
        </div>`).join('');
    }

    LOCS.forEach(loc => {
      const b = document.createElement('button');
      b.className = 'tab' + (loc.id === active.id ? ' active' : '');
      b.textContent = loc.name;
      b.onclick = () => { active = loc; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); b.classList.add('active'); load(loc); };
      document.getElementById('tabs').appendChild(b);
    });
    load(active);
  </script>
</body>
</html>
