
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>LA 7-Day Weather</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: #0f172a;
  color: #f8fafc;
  padding: 20px 14px 40px;
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

h1 {
  font-size: 1.2rem;
}

.badge {
  font-size: 0.72rem;
  background: #0284c733;
  color: #38bdf8;
  border: 1px solid #0284c766;
  padding: 4px 9px;
  border-radius: 99px;
  white-space: nowrap;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}

.tab {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  padding: 12px 4px;
  border-radius: 11px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  -webkit-appearance: none;
}

.tab.active {
  background: #38bdf8;
  color: #0f172a;
  border-color: #38bdf8;
}

.sub {
  font-size: 0.75rem;
  color: #94a3b8;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

#desc {
  line-height: 1.5;
}

.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 11px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #334155;
  padding-bottom: 10px;
  margin-bottom: 12px;
  font-weight: 700;
  font-size: 0.95rem;
}

.top span {
  color: #94a3b8;
  font-weight: 500;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px 12px;
  font-size: 0.82rem;
}

.lbl {
  color: #94a3b8;
  font-size: 0.67rem;
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.val {
  font-weight: 600;
  line-height: 1.5;
}

.msg {
  padding: 25px 12px;
  color: #94a3b8;
  line-height: 1.6;
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}

.error {
  color: #fca5a5;
}

.retry {
  margin-top: 16px;
  padding: 11px 20px;
  border: none;
  border-radius: 9px;
  background: #38bdf8;
  color: #0f172a;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}

.footer {
  color: #64748b;
  text-align: center;
  font-size: 0.7rem;
  margin-top: 20px;
}

</style>
</head>

<body>

<header>
  <h1>LA 7-Day Forecast</h1>
  <span class="badge" id="badge">Starting...</span>
</header>

<div class="tabs" id="tabs"></div>

<div class="sub">
  <span id="desc">Loading location...</span>
  <span id="time"></span>
</div>

<div id="list">
  <div class="msg">Loading weather forecast...</div>
</div>

<div class="footer">
  Weather data provided by Open-Meteo
</div>

<script>

// =====================================
// LOCATIONS
// =====================================

const LOCS = [
  {
    id: "coast",
    name: "Coast",
    desc: "Santa Monica / Venice / South Bay",
    lat: 34.0195,
    lon: -118.4912
  },
  {
    id: "basin",
    name: "LA Basin",
    desc: "DTLA / Culver City / Mid-City",
    lat: 34.0259,
    lon: -118.3965
  },
  {
    id: "valley",
    name: "Valleys",
    desc: "Pasadena / SGV / SFV",
    lat: 34.1478,
    lon: -118.1445
  }
];

let active = LOCS[0];

const cache = {};

const dirs = [
  "N","NNE","NE","ENE",
  "E","ESE","SE","SSE",
  "S","SSW","SW","WSW",
  "W","WNW","NW","NNW"
];

// =====================================
// HELPERS
// =====================================

function compass(deg) {
  if (deg == null) return "N";

  return dirs[
    Math.round(deg / 22.5) % 16
  ];
}

function average(arr, start, end) {
  const values = arr
    .slice(start, end)
    .filter(v => v != null);

  if (!values.length) return 0;

  return Math.round(
    values.reduce((a, b) => a + b, 0) /
    values.length
  );
}

function cloudText(low, mid, high, total) {

  if (total < 15) {
    return "Clear (" + total + "%)";
  }

  if (low >= mid && low >= high) {
    return "Marine Stratus (" + total + "%)";
  }

  if (mid >= low && mid >= high) {
    return "Altocumulus (" + total + "%)";
  }

  return "High Cirrus (" + total + "%)";
}

function sunText(uv, mj) {

  const u = uv || 0;
  const m = mj || 0;

  const level =
    u >= 8 ? "Very High" :
    u >= 6 ? "High" :
    u >= 3 ? "Moderate" :
    "Low";

  return "UV " + u.toFixed(1) +
    " (" + level + ") - " +
    m.toFixed(1) + " MJ/m²";
}

function safeNumber(value, decimals = 0) {
  if (value == null || !Number.isFinite(Number(value))) {
    return "N/A";
  }

  return Number(value).toFixed(decimals);
}

// =====================================
// FETCH WITH TIMEOUT
// =====================================

async function fetchWithTimeout(url, ms = 12000) {

  const controller = new AbortController();

  const timer = setTimeout(() => {
    controller.abort();
  }, ms);

  try {

    const response = await fetch(url, {
      method: "GET",
      signal: controller.signal,
      cache: "no-store"
    });

    return response;

  } finally {

    clearTimeout(timer);

  }
}

// =====================================
// BUILD WEATHER DATA
// =====================================

async function loadWeather(loc, force = false) {

  const listEl = document.getElementById("list");

  document.getElementById("desc").textContent =
    loc.desc;

  document.getElementById("time").textContent = "";

  document.getElementById("badge").textContent =
    "Loading...";

  if (!force && cache[loc.id]) {

    render(cache[loc.id], loc);
    return;

  }

  listEl.innerHTML =
    '<div class="msg">Fetching weather forecast...</div>';

  const params = new URLSearchParams({

    latitude: loc.lat,
    longitude: loc.lon,

    daily: [
      "temperature_2m_max",
      "temperature_2m_min",
      "precipitation_sum",
      "precipitation_probability_max",
      "wind_speed_10m_max",
      "wind_direction_10m_dominant",
      "uv_index_max",
      "shortwave_radiation_sum"
    ].join(","),

    hourly: [
      "cloud_cover",
      "cloud_cover_low",
      "cloud_cover_mid",
      "cloud_cover_high",
      "relative_humidity_2m"
    ].join(","),

    temperature_unit: "fahrenheit",
    wind_speed_unit: "mph",
    precipitation_unit: "inch",

    timezone: "America/Los_Angeles",
    forecast_days: "7"

  });

  const url =
    "https://api.open-meteo.com/v1/forecast?" +
    params.toString();

  try {

    // Open-Meteo is the ONLY required weather provider.
    const response = await fetchWithTimeout(url);

    if (!response.ok) {
      throw new Error(
        "Weather API returned HTTP " + response.status
      );
    }

    const om = await response.json();

    if (
      !om.daily ||
      !om.hourly ||
      !Array.isArray(om.daily.time)
    ) {
      throw new Error("Invalid weather data received.");
    }

    const days = om.daily.time.map((date, i) => {

      // Daytime hours: 8 AM through 6 PM.
      const start = i * 24 + 8;
      const end = i * 24 + 19;

      const hi = om.daily.temperature_2m_max[i];
      const lo = om.daily.temperature_2m_min[i];

      const rain =
        om.daily.precipitation_sum[i];

      const pop =
        om.daily.precipitation_probability_max[i];

      const lowCloud = average(
        om.hourly.cloud_cover_low, start, end
      );

      const midCloud = average(
        om.hourly.cloud_cover_mid, start, end
      );

      const highCloud = average(
        om.hourly.cloud_cover_high, start, end
      );

      const totalCloud = average(
        om.hourly.cloud_cover, start, end
      );

      const humidity = average(
        om.hourly.relative_humidity_2m,
        start,
        end
      );

      const windSpeed =
        om.daily.wind_speed_10m_max[i];

      const windDirection =
        om.daily.wind_direction_10m_dominant[i];

      const uv =
        om.daily.uv_index_max[i];

      const radiation =
        om.daily.shortwave_radiation_sum[i];

      const dateObj =
        new Date(date + "T12:00:00");

      const label = i === 0
        ? "Today"
        : dateObj.toLocaleDateString("en-US", {
            weekday: "short",
            month: "short",
            day: "numeric"
          });

      return {

        lbl: label,

        hi: safeNumber(hi),
        lo: safeNumber(lo),

        pop: safeNumber(pop),
        rainIn: safeNumber(rain, 2),

        cld: cloudText(
          lowCloud,
          midCloud,
          highCloud,
          totalCloud
        ),

        hum: safeNumber(humidity),

        wnd:
          compass(windDirection) +
          " " + safeNumber(windSpeed) +
          " mph",

        sun: sunText(
          Number(uv) || 0,
          Number(radiation) || 0
        )

      };

    });

    if (days.length === 0) {
      throw new Error("No forecast days were returned.");
    }

    const data = {

      days: days,

      time: new Date().toLocaleTimeString(
        "en-US",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      )

    };

    cache[loc.id] = data;

    // Only update the screen if this is still
    // the currently selected location.
    if (active.id === loc.id) {
      render(data, loc);
    }

  } catch (error) {

    console.error("Weather loading error:", error);

    if (active.id !== loc.id) return;

    document.getElementById("badge").textContent =
      "Unavailable";

    const message =
      error.name === "AbortError"
        ? "The weather server took too long to respond."
        : error.message;

    listEl.innerHTML = "";

    const errorBox = document.createElement("div");
    errorBox.className = "msg error";

    const title = document.createElement("strong");
    title.textContent = "Unable to load weather.";

    const detail = document.createElement("p");
    detail.style.marginTop = "10px";
    detail.textContent = message;

    const retry = document.createElement("button");
    retry.className = "retry";
    retry.textContent = "Try Again";

    retry.onclick = () => {
      loadWeather(loc, true);
    };

    errorBox.appendChild(title);
    errorBox.appendChild(detail);
    errorBox.appendChild(retry);

    listEl.appendChild(errorBox);

  }

}

// =====================================
// DISPLAY FORECAST
// =====================================

function render(data, loc) {

  document.getElementById("badge").textContent =
    "Open-Meteo";

  document.getElementById("desc").textContent =
    loc.desc;

  document.getElementById("time").textContent =
    "Updated " + data.time;

  const list = document.getElementById("list");

  list.innerHTML = data.days.map(x => `

    <div class="card">

      <div class="top">

        <div>${x.lbl}</div>

        <div>
          ${x.hi}&deg;
          <span>/ ${x.lo}&deg;</span>
        </div>

      </div>

      <div class="grid">

        <div>
          <span class="lbl">Precipitation</span>
          <span class="val" style="color:#60a5fa">
            ${x.pop}% · ${x.rainIn}"
          </span>
        </div>

        <div>
          <span class="lbl">Clouds</span>
          <span class="val">${x.cld}</span>
        </div>

        <div>
          <span class="lbl">Wind (Peak)</span>
          <span class="val">${x.wnd}</span>
        </div>

        <div>
          <span class="lbl">Humidity (Day)</span>
          <span class="val">${x.hum}%</span>
        </div>

        <div style="grid-column:span 2">

          <span class="lbl">Sun Intensity</span>

          <span class="val" style="color:#fbbf24">
            ${x.sun}
          </span>

        </div>

      </div>

    </div>

  `).join("");

}

// =====================================
// LOCATION TABS
// =====================================

function createTabs() {

  const tabs = document.getElementById("tabs");

  LOCS.forEach(loc => {

    const button = document.createElement("button");

    button.className =
      "tab" +
      (loc.id === active.id ? " active" : "");

    button.textContent = loc.name;

    button.onclick = () => {

      active = loc;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      button.classList.add("active");

      loadWeather(loc);

    };

    tabs.appendChild(button);

  });

}

// =====================================
// START APPLICATION
// =====================================

createTabs();

loadWeather(active);

</script>

</body>
</html>
