<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA Weather</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px 14px 40px; max-width: 600px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.2rem; }
    .badge { font-size: 0.72rem; background: #0284c733; color: #38bdf8; border: 1px solid #0284c766; padding: 3px 8px; border-radius: 99px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; }
    .tab.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .sub { font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; font-weight: 700; }
    .top span { color: #94a3b8; font-weight: 500; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 0.82rem; }
    .lbl { color: #94a3b8; font-size: 0.68rem; text-transform: uppercase; display: block; }
    .val { font-weight: 600; }
    .msg { padding: 20px 10px; color: #94a3b8; line-height: 1.5; word-break: break-all; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>LA 7-Day Forecast</h1>
    <span class="badge" id="badge">v6</span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="sub"><span id="desc"></span><span id="time"></span></div>
  <div id="list"><div class="msg">Loading v6...</div></div>

  <script>
    var LOCS = [
      { id: "coast", name: "Coast", desc: "Santa Monica / Venice / South Bay", lat: "34.0195", lon: "-118.4912" },
      { id: "basin", name: "LA Basin", desc: "DTLA / Culver City / Mid-City", lat: "34.0259", lon: "-118.3965" },
      { id: "valley", name: "Valleys", desc: "Pasadena / SGV / SFV", lat: "34.1478", lon: "-118.1445" }
    ];

    var active = LOCS.at(0);
    var cache = {};
    var dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

    function compass(deg) {
      return dirs.at(Math.round((deg || 0) / 22.5) % 16);
    }

    function cloudText(l, m, h, t) {
      if (t < 15) return "Clear (" + t + "%)";
      if (l >= m && l >= h) return (t > 75 ? "Overcast Stratus (" : "Marine Stratus (") + t + "%)";
      if (m >= l && m >= h) return "Altocumulus (" + t + "%)";
      return "High Cirrus (" + t + "%)";
    }

    function sunText(uv, mj) {
      var u = uv || 0, m = mj || 0;
      var lvl = u >= 8 ? "Very High" : u >= 6 ? "High" : u >= 3 ? "Moderate" : "Low";
      return "UV " + u.toFixed(1) + " (" + lvl + ") - " + m.toFixed(1) + " MJ/m2";
    }

    async function loadWeather(loc) {
      var listEl = document.getElementById("list");
      document.getElementById("desc").textContent = loc.desc;
      if (cache[loc.id]) { render(cache[loc.id]); return; }

      var query = [
        "latitude=" + loc.lat,
        "longitude=" + loc.lon,
        "daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,uv_index_max,shortwave_radiation_sum",
        "hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,relative_humidity_2m",
        "temperature_unit=fahrenheit",
        "wind_speed_unit=mph",
        "precipitation_unit=inch",
        "timezone=America%2FLos_Angeles"
      ].join("&");

      var omUrl = "https://open-meteo.com?" + query;

      try {
        var res = await fetch(omUrl);
        if (!res.ok) throw new Error("HTTP " + res.status);
        var om = await res.json();
        var nwsMap = await fetchNwsSafe(loc.lat, loc.lon);

        var days = om.daily.time.map(function(dt, i) {
          var s = i * 24 + 8, e = i * 24 + 19;
          function avg(arr) {
            var sum = 0;
            for (var k = s; k < e; k++) sum += (arr.at(k) || 0);
            return Math.round(sum / 11);
          }
          var hi = om.daily.temperature_2m_max.at(i) || 0;
          var lo = om.daily.temperature_2m_min.at(i) || 0;
          var pop = om.daily.precipitation_probability_max.at(i) || 0;
          if (nwsMap && nwsMap[dt]) {
            if (nwsMap[dt].hi !== undefined) hi = (hi + nwsMap[dt].hi) / 2;
            if (nwsMap[dt].lo !== undefined) lo = (lo + nwsMap[dt].lo) / 2;
            pop = Math.round((pop + Math.max(nwsMap[dt].dPop || 0, nwsMap[dt].nPop || 0)) / 2);
          }
          var dObj = new Date(dt + "T12:00:00");
          var lbl = i === 0 ? "Today" : dObj.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
          return {
            lbl: lbl, hi: Math.round(hi), lo: Math.round(lo), pop: pop,
            rainIn: (om.daily.precipitation_sum.at(i) || 0).toFixed(2),
            cld: cloudText(avg(om.hourly.cloud_cover_low), avg(om.hourly.cloud_cover_mid), avg(om.hourly.cloud_cover_high), avg(om.hourly.cloud_cover)),
            hum: avg(om.hourly.relative_humidity_2m),
            wnd: compass(om.daily.wind_direction_10m_dominant.at(i)) + " " + Math.round(om.daily.wind_speed_10m_max.at(i) || 0) + " mph",
            sun: sunText(om.daily.uv_index_max.at(i), om.daily.shortwave_radiation_sum.at(i))
          };
        });

        cache[loc.id] = { days: days, blended: Boolean(nwsMap), time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
        render(cache[loc.id]);
      } catch (err) {
        listEl.innerHTML = "<div class='msg'><strong>Error:</strong> " + err.message + "<br><br><strong>URL attempted:</strong><br>" + omUrl + "</div>";
      }
    }

    async function fetchNwsSafe(lat, lon) {
      try {
        var r1 = await fetch("https://weather.gov" + lat + "," + lon);
        if (!r1.ok) return null;
        var j1 = await r1.json();
        var fcUrl = j1 && j1.properties && j1.properties.forecast;
        if (!fcUrl || typeof fcUrl !== "string") return null;
        var r2 = await fetch(fcUrl.trim());
        if (!r2.ok) return null;
        var j2 = await r2.json();
        var map = {};
        j2.properties.periods.forEach(function(p) {
          var k = p.startTime.slice(0, 10);
          if (!map[k]) map[k] = {};
          var pop = (p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value) || 0;
          if (p.isDaytime) { map[k].hi = p.temperature; map[k].dPop = pop; }
          else { map[k].lo = p.temperature; map[k].nPop = pop; }
        });
        return map;
      } catch (e) { return null; }
    }

    function render(data) {
      document.getElementById("badge").textContent = data.blended ? "NWS + Open-Meteo" : "Open-Meteo";
      document.getElementById("time").textContent = "Updated " + data.time;
      document.getElementById("list").innerHTML = data.days.map(function(x) {
        return "<div class='card'>" +
          "<div class='top'><div>" + x.lbl + "</div><div>" + x.hi + "&deg; <span>/ " + x.lo + "&deg;</span></div></div>" +
          "<div class='grid'>" +
            "<div><span class='lbl'>Precipitation</span><span class='val' style='color:#60a5fa'>" + x.pop + "% &middot; " + x.rainIn + "\"</span></div>" +
            "<div><span class='lbl'>Clouds</span><span class='val'>" + x.cld + "</span></div>" +
            "<div><span class='lbl'>Wind (Peak)</span><span class='val'>" + x.wnd + "</span></div>" +
            "<div><span class='lbl'>Humidity (Day)</span><span class='val'>" + x.hum + "%</span></div>" +
            "<div style='grid-column:span 2'><span class='lbl'>Sun Intensity</span><span class='val' style='color:#fbbf24'>" + x.sun + "</span></div>" +
          "</div></div>";
      }).join("");
    }

    LOCS.forEach(function(loc) {
      var btn = document.createElement("button");
      btn.className = "tab" + (loc.id === active.id ? " active" : "");
      btn.textContent = loc.name;
      btn.onclick = function() {
        active = loc;
        document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
        btn.classList.add("active");
        loadWeather(loc);
      };
      document.getElementById("tabs").appendChild(btn);
    });

    loadWeather(active);
  </script>
</body>
</html>
